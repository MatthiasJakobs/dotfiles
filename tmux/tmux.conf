# Solarized Light (official altercation/solarized palette)
set -g status-style 'bg=#010409,fg=#e6edf3'
set -g status-left '#[bg=#58a6ff,fg=#e6edf3,bold] #S '
set -g status-right '#[fg=#e6edf3]#H '
set -g status-justify centre
set -g window-status-style 'bg=#010409,fg=#b1bac4'
set -g window-status-current-style 'bg=#010409,fg=#79c0ff,bold'
set -g pane-border-lines 'simple'
set -g pane-border-style 'fg=#93a1a1'
set -g pane-active-border-style 'fg=#79c0ff'
set -g message-style 'bg=#010409,fg=#cb4b16,bold'
set -g mode-style 'bg=#010409,fg=#586e75'
set -g status-position top
set -g popup-border-style 'fg=#79c0ff'

## Plugin manager
set -g @plugin 'tmux-plugins/tpm'

## List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

## This has to be the last line to initialize tpm properly
run '~/.tmux/plugins/tpm/tpm'
