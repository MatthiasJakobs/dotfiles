set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc'
set -g history-limit 10000
set -g extended-keys on

set -g base-index 1
set -g status-right '#(hostname) #(date +"%H:%M")'


# Mouse stuff
set -g mouse on

set-option -g renumber-windows on
set -g status-left-length 20

bind-key -r f run-shell "tmux neww tmux-fzf"

# Copy paste
setw -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

# Keybindings
bind r source-file ~/.config/tmux/tmux.conf
bind f resize-pane -Z
bind g popup -E -w 90% -h 80% lazygit

# Solarized Light (official altercation/solarized palette)
set -g status-style 'bg=#fdf6e3,fg=#657b83'
set -g status-left '#[bg=#268bd2,fg=#fdf6e3,bold] #S '
set -g status-right '#[fg=#586e75]#H '
set -g status-justify centre
set -g window-status-style 'bg=#fdf6e3,fg=#839496'
set -g window-status-current-style 'bg=#fdf6e3,fg=#268bd2,bold'
set -g pane-border-lines 'simple'
set -g pane-border-style 'fg=#93a1a1'
set -g pane-active-border-style 'fg=#268bd2'
set -g message-style 'bg=#eee8d5,fg=#cb4b16,bold'
set -g mode-style 'bg=#eee8d5,fg=#586e75'
set -g status-position top
set -g popup-border-style 'fg=#268bd2'

## Plugin manager
set -g @plugin 'tmux-plugins/tpm'

## List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

## This has to be the last line to initialize tpm properly
run '~/.tmux/plugins/tpm/tpm'
